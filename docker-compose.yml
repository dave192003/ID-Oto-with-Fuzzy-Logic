services:
  backend:
    build: ./backend
    container_name: id-oto-backend

    restart: always

    ports:
      - "8000:8000"

    volumes:
      - ./backend:/app

  frontend:
    build: ./frontend
    container_name: id-oto-frontend

    restart: always

    ports:
      - "8080:80"

    depends_on:
      - backend